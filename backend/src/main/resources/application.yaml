spring:
  application:
    name: nais-chat
  main:
    banner-mode: "off"
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/chat}
    username: ${DB_USERNAME:chat}
    password: ${DB_PASSWORD:chat}
server:
  shutdown: graceful
  tomcat:
    threads:
      max: 100
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: logstash
chat:
  instance: ${HOSTNAME:local}
