apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: chat-messages
  namespace: flais
  labels:
    team: flais
spec:
  pool: novari-test
  config:
    partitions: 1
    replication: 3
    minimumInSyncReplicas: 2
    retentionHours: 24
    cleanupPolicy: delete
  acl:
    - team: flais
      application: nais-chat-backend
      access: readwrite