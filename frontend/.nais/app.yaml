apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nais-chat-frontend
  namespace: flais
  labels:
    team: flais
spec:
  port: 8080
  ingresses:
    - nais-chat.test.novari.cloud.nais.io
  replicas:
    min: 1
    max: 2
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  env:
    - name: BACKEND_HOST
      value: nais-chat-backend
  accessPolicy:
    outbound:
      rules:
        - application: nais-chat-backend
  liveness:
    path: /healthz
  readiness:
    path: /healthz
